
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Text Formatting</title>
</head>
<body>

    <h1>Heading 1</h1>
    <h2>Heading 2</h2>
    <h3>Heading 3</h3>

    <p>
        This is a paragraph with
        <b>Bold</b>,
        <i>Italic</i>,
        <u>Underline</u> and
        <mark>Highlighted</mark> text.
    </p>

    <p>
        H<sub>2</sub>O and X<sup>2</sup>
    </p>

    <p>
        &copy; &reg; &trade; &lt; &gt; &amp; &euro;
    </p>

    <hr>

    <p>
        Line one<br>
        Line two
    </p>

</body>
</html>
