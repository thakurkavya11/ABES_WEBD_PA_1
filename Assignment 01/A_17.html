<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <form>
        <input type="text" name="name" placeholder="Full name"
               required size="30">
        <br><br>

        <input type="email" name="email" placeholder="you@college.edu"
               required size="30">
        <br><br>

        <input type="tel" name="mobile" placeholder="10-digit mobile"
               pattern="[0-9]{10}" required size="30">
        <br><br>

        <input type="password" name="password" placeholder="Min 6 characters"
               minlength="6" required size="30">
        <br><br>

        <input type="number" name="age" placeholder="Age (17+)"
               min="17" required>
        <br><br>

        <button type="submit">Register</button>
    </form>

</body>
</html>
